# Official catalog of Fyso Agentic Framework extensions (D31).
# Format: docs/extensions-contract.md §8 in fyso-dev/agentic-framework.
# Versions are not listed here: they are the git tags of each extension repo.
name: Fyso
extensions:
  - id: biz
    src: gh:fyso-dev/fyso-ext-biz
    name: {es: Fyso Biz, en: Fyso Biz}
    description: {es: "Equipos de agentes, OKRs, KPIs y palancas desde Fyso Business, con inicio de sesión desde el panel (panel API v1)", en: "Agent teams, OKRs, KPIs and levers from Fyso Business, with sign-in from the panel (panel API v1)"}
    tags: [business, okr, kpi, mcp]
    homepage: https://fyso.biz
  - id: langfuse
    src: gh:fyso-dev/fyso-ext-langfuse
    name: {es: Langfuse, en: Langfuse}
    description: {es: "Trazas, tokens y costos de los bots en Langfuse Cloud", en: "Bot traces, tokens and costs in Langfuse Cloud"}
    tags: [observability, tracing, llm]
    homepage: https://langfuse.com
  - id: silverbullet
    src: gh:fyso-dev/fyso-ext-silverbullet
    name: {es: SilverBullet, en: SilverBullet}
    description: {es: "Base de conocimiento compartida, editor e importación con IA", en: "Shared knowledge base, editor and AI document import"}
    tags: [knowledge, wiki, documents, mcp]
    homepage: https://silverbullet.md
  - id: human-requests
    src: gh:fyso-dev/fyso-ext-human-requests
    name: {es: Pedidos humanos, en: Human requests}
    description: {es: "Los bots piden decisiones o aclaraciones a personas; bandeja Pendientes y directorio de personas", en: "Bots ask people for decisions or clarifications; Pending inbox and people directory"}
    tags: [workflow, approvals, human-in-the-loop, dagu]
  - id: netbird
    src: gh:fyso-dev/fyso-ext-netbird
    name: {es: NetBird, en: NetBird}
    description: {es: Publica las apps del proyecto por HTTPS con el reverse proxy de NetBird, en: Publish the project's apps over HTTPS through the NetBird reverse proxy}
    tags: [network, remote-access]
    homepage: https://netbird.io
  - id: hub
    src: gh:fyso-dev/fyso-ext-hub
    name: {es: Hub de instancias, en: Instance hub}
    description: {es: "Menú en la barra superior para saltar a las otras instancias del hub de este servidor (panel API v3)", en: "Top-bar menu to jump to the other instances of this host's hub (panel API v3)"}
    tags: [hub, navigation]
    homepage: https://github.com/fyso-dev/fyso-hub
  - id: discord
    src: gh:fyso-dev/fyso-ext-discord
    name: {es: Discord, en: Discord}
    description: {es: "Un agente del proyecto responde en canales de Discord, en hilos que recuerdan la conversación", en: "A project agent answers in Discord channels, in threads that keep the conversation"}
    tags: [chat, channels, discord]
    homepage: https://discord.com/developers/applications
