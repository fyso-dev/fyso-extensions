    homepage: https://fyso.biz
  - id: langfuse
    src: gh:fyso-dev/fyso-ext-langfuse
    name: {es: Langfuse, en: Langfuse}
    description: {es: "Trazas, tokens y costos de los bots en Langfuse Cloud", en: "Bot traces, tokens and costs in Langfuse Cloud"}
    tags: [observability, tracing, llm]
    homepage: https://langfuse.com
  - id: silverbullet
    src: gh:fyso-dev/fyso-ext-silverbullet
    name: {es: SilverBullet, en: SilverBullet}
    description: {es: "Base de conocimiento compartida, editor e importación con IA", en: "Shared knowledge base, editor and AI document import"}
    tags: [knowledge, wiki, documents, mcp]
    homepage: https://silverbullet.md
  - id: netbird
    src: gh:fyso-dev/fyso-ext-netbird
    name: {es: NetBird, en: NetBird}
